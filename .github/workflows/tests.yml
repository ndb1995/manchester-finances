name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements.txt
      # Parses both books for real, and fails if the committed data.js is stale.
      - run: python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The page's pure logic, against the committed data.js.
      - run: node --test "tests/js/*.test.js"
